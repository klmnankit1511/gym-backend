name: Build and deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-webapp-production
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: app-bhupesh-gym-portal
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q app alembic scripts

      - name: Create deployment package
        run: zip -r release.zip app alembic scripts alembic.ini requirements.txt

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: webapp-package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
